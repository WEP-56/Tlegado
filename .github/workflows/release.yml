name: Build release packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Verify tag version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
      - name: Build binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage native binary
        shell: bash
        run: |
          mkdir -p "dist/binaries/${{ matrix.platform }}-${{ matrix.arch }}"
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            cp "target/${{ matrix.target }}/release/tlegado.exe" "dist/binaries/${{ matrix.platform }}-${{ matrix.arch }}/tlegado.exe"
          else
            cp "target/${{ matrix.target }}/release/tlegado" "dist/binaries/${{ matrix.platform }}-${{ matrix.arch }}/tlegado"
          fi
      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/binaries/${{ matrix.platform }}-${{ matrix.arch }}/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist/binaries
          merge-multiple: false
      - name: Arrange native binaries
        shell: bash
        run: |
          mkdir -p dist/binaries/linux-x64 dist/binaries/darwin-x64 dist/binaries/darwin-arm64 dist/binaries/win32-x64
          find dist/binaries -type f -name tlegado -exec sh -c 'case "$1" in *linux*) cp "$1" dist/binaries/linux-x64/tlegado;; *darwin-x64*) cp "$1" dist/binaries/darwin-x64/tlegado;; *darwin-arm64*) cp "$1" dist/binaries/darwin-arm64/tlegado;; esac' _ {} \;
          find dist/binaries -type f -name tlegado.exe -exec cp {} dist/binaries/win32-x64/tlegado.exe \;
      - name: Package universal npm artifact
        run: node scripts/package-universal.mjs "${GITHUB_REF_NAME#v}" dist/binaries dist/npm
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/npm/*.tgz dist/binaries/linux-x64/tlegado dist/binaries/darwin-x64/tlegado dist/binaries/darwin-arm64/tlegado dist/binaries/win32-x64/tlegado.exe)
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "${assets[@]}" --clobber
          else
            gh release create "${{ github.ref_name }}" "${assets[@]}" --generate-notes --title "${{ github.ref_name }}"
          fi
