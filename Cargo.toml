[package]
name = "tlegado"
version = "0.3.0"
edition = "2021"
description = "Tlegado — 支持 Legado 书源的终端阅读器"

[workspace]
members = ["crates/legado-core"]
default-members = ["."]
resolver = "2"

[dependencies]
# TUI 核心
ratatui = "0.29"
crossterm = "0.28"

# 工具
unicode-width = "0.2"
anyhow = "1"
reader-core = { package = "reader-rust", path = "crates/legado-core" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
fancy-regex = "0.16"
rquickjs = "0.7"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis"] }
sha2 = "0.10"
tempfile = "3"
base64 = "0.23.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Speech", "Win32_System_Com"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.7"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[patch.crates-io]
pdf-extract = { path = "crates/legado-core/vendor/pdf-extract" }

[profile.release]
lto = true
codegen-units = 1
strip = true
